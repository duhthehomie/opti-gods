[package]
name = "opti-gods"
version = "2.1.0"
description = "Opti Gods — Windows PC optimizer (Tauri shell)"
authors = ["leaq"]
license = "Proprietary"
edition = "2021"
rust-version = "1.77"

[lib]
name = "opti_gods_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Embeds app.manifest into the final .exe so UAC requireAdministrator + DPI
# awareness directives are honoured by Windows.
winresource = "0.1"

[dependencies]
# Tauri core
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime + sync primitives
tokio = { version = "1", features = ["full"] }
once_cell = "1"
parking_lot = "0.12"

# Logging
log = "0.4"
env_logger = "0.11"

# Errors
thiserror = "1"
anyhow = "1"

# Random / IDs (for OAuth state)
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"

# HTTP for Discord OAuth token exchange (reqwest is brought in by tauri-plugin-http internally,
# but we need our own client for the loopback handler too).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"

# Secure token storage (Windows Credential Manager on Windows).
keyring = { version = "3", features = ["windows-native"] }

# Windows-only deps — everything below only compiles on Windows targets.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
wmi = "0.14"
windows-service = "0.7"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Restore",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
] }

[features]
default = ["custom-protocol"]
# When the .exe is run standalone (not via `tauri dev`), enable the
# custom asset protocol so the embedded React bundle can load.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
