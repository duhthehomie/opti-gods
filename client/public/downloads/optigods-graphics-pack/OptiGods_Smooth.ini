/*
   OPTI GODS - SMOOTH ReShade Preset v1.0
   Designed for FiveM — light-game players
   Clean, sharp, smooth visuals without destroying FPS
   
   Install: Drop in your FiveM folder alongside ReShade
   Discord: discord.gg/C8WrQknN9k
*/

[TECHNIQUE]
Techniques=CAS,Vibrance,LiftGammaGain,Curves
TechniquesEnabled=CAS,Vibrance,LiftGammaGain,Curves

[CAS.fx]
Sharpness=0.350000

[Vibrance.fx]
Vibrance=0.180000
VibranceRGBBalance=1.000000,1.000000,1.000000

[LiftGammaGain.fx]
RGB_Lift=0.995000,0.995000,1.000000
RGB_Gamma=1.010000,1.005000,0.990000
RGB_Gain=1.020000,1.015000,1.000000

[Curves.fx]
Mode=0
Formula=4
Contrast=0.120000

[SMAA.fx]
EdgeDetectionType=1
EdgeDetectionThreshold=0.100000
MaxSearchSteps=32
MaxSearchStepsDiagonal=16
CornerRounding=25
DebugOutput=0
