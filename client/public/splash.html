<!doctype html>
<!--
  Initial splash window. Lives inside the Tauri bundle (frontendDist) and is
  swapped out for the main React app once boot finishes. The window itself is
  decoration-less + transparent so the red ring video reads as a free-floating
  logo. The Rust splash::finish() command hides this window and reveals "main".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Opti Gods</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: transparent; overflow: hidden;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        color: #fff;
      }
      .stage {
        width: 100%; height: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 18px;
      }
      .ring {
        width: 220px; height: 220px;
        border-radius: 50%;
        border: 6px solid rgba(255, 30, 30, 0.18);
        border-top-color: #ff1e1e;
        animation: spin 1.05s linear infinite;
        box-shadow: 0 0 60px rgba(255, 30, 30, 0.45), inset 0 0 20px rgba(255, 30, 30, 0.25);
      }
      .word { font-weight: 700; letter-spacing: 0.18em; font-size: 13px; opacity: 0.85; text-transform: uppercase; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="ring" aria-hidden="true"></div>
      <div class="word">Opti Gods</div>
    </div>
  </body>
</html>
