<!doctype html>
<!--
  Initial splash window. Fullscreen + full-bleed red spinning logo video.
  The Rust splash::finish() command hides this window and reveals "main".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Opti Gods</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #000; overflow: hidden;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        color: #fff;
      }
      .stage {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #000;
      }
      video, .fallback-ring-wrap {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
      }
      .fallback-ring-wrap {
        display: none;
        align-items: center; justify-content: center;
        flex-direction: column; gap: 18px;
      }
      .ring {
        width: 220px; height: 220px;
        border-radius: 50%;
        border: 6px solid rgba(255, 30, 30, 0.18);
        border-top-color: #ff1e1e;
        animation: spin 1.05s linear infinite;
        box-shadow: 0 0 60px rgba(255, 30, 30, 0.45), inset 0 0 20px rgba(255, 30, 30, 0.25);
      }
      .word {
        position: absolute; bottom: 7vh; left: 0; right: 0;
        text-align: center;
        font-weight: 700; letter-spacing: 0.3em; font-size: 13px;
        opacity: 0.85; text-transform: uppercase;
        text-shadow: 0 0 12px rgba(255, 30, 30, 0.5);
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="stage">
      <video autoplay muted playsinline preload="auto"
             onerror="document.querySelector('.fallback-ring-wrap').style.display='flex'">
        <source src="/branding/spin-red.mp4" type="video/mp4" />
      </video>
      <div class="fallback-ring-wrap" aria-hidden="true">
        <div class="ring"></div>
      </div>
      <div class="word">Opti Gods</div>
    </div>
  </body>
</html>
