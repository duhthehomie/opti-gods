Title: "Opti Gods OS"
ShortDescription: "Gaming-first Windows optimization by leaq"
Description: |
  Opti Gods OS transforms Windows 10/11 into a lean, gaming-focused machine.
  Strips telemetry, bloat, and dead weight at the OS level.
  Built by leaq — discord.gg/C8WrQknN9k
Author: "leaq"
Version: "1.0.0"
Url: "https://discord.gg/C8WrQknN9k"
OsBuilds:
  - "19041"
  - "19042"
  - "19043"
  - "19044"
  - "19045"
  - "22000"
  - "22621"
  - "22631"
  - "26100"
UseKernelDriver: false
Options:
  - Name: "RemoveDefender"
    Text: "Remove Windows Defender"
    Description: "Disables real-time protection. Only if you have another AV."
    DefaultState: "false"
    Order: 0
  - Name: "RemoveEdge"
    Text: "Remove Microsoft Edge"
    Description: "Completely removes Edge browser and background services."
    DefaultState: "false"
    Order: 1
  - Name: "RemoveOneDrive"
    Text: "Remove OneDrive"
    Description: "Uninstalls OneDrive and prevents reinstall."
    DefaultState: "true"
    Order: 2
  - Name: "RemoveXbox"
    Text: "Remove Xbox App & Game Bar"
    Description: "Removes Xbox App, Xbox Identity, and Game Bar injection."
    DefaultState: "true"
    Order: 3
  - Name: "DisableWindowsUpdate"
    Text: "Disable Automatic Windows Update"
    Description: "Stop auto-updates. You can still update manually."
    DefaultState: "false"
    Order: 4
  - Name: "DisableCortana"
    Text: "Remove Cortana & Bing Search"
    Description: "Removes Cortana and Bing search from Start menu."
    DefaultState: "true"
    Order: 5
  - Name: "DisableTelemetry"
    Text: "Disable All Telemetry"
    Description: "Stops DiagTrack, CEIP, CompatTelRunner, and 30+ telemetry mechanisms."
    DefaultState: "true"
    Order: 6
